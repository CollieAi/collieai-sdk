[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "collieai"
dynamic = ["version"]
description = "AI guardrails SDK for Python: prompt injection detection, PII redaction and safe LLM streaming for OpenAI, Anthropic and your own models."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CollieAi", email = "sdk@collieai.io" }]
keywords = ["llm-security", "ai-guardrails", "guardrails", "prompt-injection", "ai-firewall", "llm-firewall", "pii-redaction", "content-moderation", "llm", "openai", "anthropic", "streaming"]
# No license classifier: the SPDX `license` expression above is the license
# field (PEP 639); a classifier next to it is deprecated and refused by builds.
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2,<3",
]

[project.urls]
Homepage = "https://collieai.io/?utm_source=pypi&utm_medium=package&utm_campaign=sdk-python"
Documentation = "https://docs.collieai.io/sdks/python-sdk?utm_source=pypi&utm_medium=package&utm_campaign=sdk-python"
Repository = "https://github.com/CollieAi/collieai-sdk"
Issues = "https://github.com/CollieAi/collieai-sdk/issues"
Changelog = "https://github.com/CollieAi/collieai-sdk/blob/main/python/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mutmut>=2.4,<3"]
# Provider adapter extras — the adapters themselves duck-type the client, so
# these only pull in the provider SDK so you have a client to pass in. Major
# bounds because the adapters read provider stream-chunk shapes; a major SDK
# bump may change those, so re-verify (and widen) before allowing it.
openai = ["openai>=1,<2"]
anthropic = ["anthropic>=0.39,<1"]

# Single-source the version: collieai/_version.py is the only place it lives
# (User-Agent reads __version__ at runtime; the build reads it here).
[tool.hatch.version]
path = "collieai/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["collieai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
