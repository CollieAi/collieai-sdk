name: CI

# Offline checks of the three SDKs: unit tests, builds and examples. No
# secrets, no backend, no publishing. Pull requests from forks run with a
# read-only token; `CI required` is the single check branch protection
# requires, and it fails unless every job below succeeded — a skipped or
# cancelled job is not a pass.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # declared minimum and a current release
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the SDK and the example dependencies
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          # the SDK's own `openai` extra, so the example runs against the
          # provider SDK major the adapters support
          python -m pip install -e ".[dev,openai]" fastapi
      - name: Unit tests and example tests (nothing may be skipped)
        working-directory: python
        run: |
          python -m pytest tests -q --junitxml=results.xml
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          root = ET.parse("results.xml").getroot()
          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(f"{tests} tests, {skipped} skipped")
          assert tests > 0 and skipped == 0, "a skipped or empty test run is not a pass"
          EOF
      - name: The FastAPI example imports against the SDK
        working-directory: python
        env:
          COLLIEAI_API_KEY: clai_ci_dummy
          COLLIEAI_PROJECT_ID: project_ci_dummy
          OPENAI_API_KEY: sk-ci-dummy
        run: python -c "import examples.fastapi_app"

  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # declared engines floor and the active LTS
        node: ["18", "24"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install, typecheck, test, build
        working-directory: node
        run: |
          npm ci
          npx tsc --noEmit -p tsconfig.json
          npx tsc --noEmit -p examples/tsconfig.json
          npx vitest run
          npm run build

  dotnet:
    name: .NET 8
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "8.0.x"
      - name: Tests (nothing may be skipped)
        # Read every TRX report: the summary line is per project, and a
        # skipped xunit test shows only as total != executed in the TRX.
        working-directory: dotnet
        run: |
          set -euo pipefail
          dotnet test CollieAi.sln --nologo --logger trx --results-directory "$RUNNER_TEMP/trx"
          python3 - "$RUNNER_TEMP"/trx/*.trx <<'EOF'
          import sys
          import xml.etree.ElementTree as ET
          ns = "{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}"
          total = 0
          for path in sys.argv[1:]:
              root = ET.parse(path).getroot()
              counters = root.find(f".//{ns}Counters")
              outcomes = [r.get("outcome") for r in root.iter(f"{ns}UnitTestResult")]
              n, executed, passed = (int(counters.get(k, 0)) for k in ("total", "executed", "passed"))
              assert n == executed == passed == len(outcomes) and set(outcomes) <= {"Passed"}, (path, counters.attrib)
              total += n
          # 357 = the public .NET suite on 2026-10-05: a test project missing
          # from the solution must not pass as "nothing skipped"
          assert total >= 357, f"only {total} tests ran"
          print(f"{total} tests in {len(sys.argv) - 1} report(s): none skipped, none failed")
          EOF
      - name: Strict library build and the example
        working-directory: dotnet
        run: |
          dotnet build src/CollieAi.Client/CollieAi.Client.csproj -c Release --no-incremental --warnaserror --nologo
          dotnet build examples/AspNetCoreChat/AspNetCoreChat.csproj --nologo

  required:
    name: CI required
    needs: [python, node, dotnet]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || { echo "a job ended as '$result' — not a pass"; exit 1; }
          done
          [ "$(echo "$RESULTS" | wc -w)" -eq 3 ] || { echo "expected three job results"; exit 1; }
